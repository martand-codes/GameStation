services:
  postgres:
    image: postgres:18
    container_name: Game_Station
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - gamestation_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: gamestation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gamestation_redis_data:/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: gamestation-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./Backend/.env
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: gamestation-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  gamestation_data:
  gamestation_redis_data: