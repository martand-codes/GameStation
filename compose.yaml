services:
  postgres:
    image: postgres:18
    container_name: Game_Station
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - gamestation_data:/var/lib/postgresql

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: gamestation-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_ACCESS_KEY=${JWT_ACCESS_KEY}
      - JWT_REFRESH_KEY=${JWT_REFRESH_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHER_KEY=${STRIPE_PUBLISHER_KEY}
      - PLATFORM_MASTER_RECOVERY_KEY=${PLATFORM_MASTER_RECOVERY_KEY}
    env_file:
      - ./Backend/.env
    depends_on:
      - postgres

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: gamestation-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  gamestation_data:
