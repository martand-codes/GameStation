services:
  postgres:
    image: postgres:18
    container_name: Game_Station
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - gamestation_data:/var/lib/postgresql

volumes:
  gamestation_data: